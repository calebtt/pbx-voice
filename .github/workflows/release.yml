name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  id-token: write     # sign the build provenance
  attestations: write # store it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test PbxVoice.sln -c Release
      - name: Build self-contained binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          for rid in linux-x64 linux-arm64; do
            dir="out/pbx-voice-$version-$rid"
            dotnet publish src/PbxVoice.Daemon -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version="$version" -o "$dir"
            # Debug symbols, XML docs, and a Windows-only codec DLL from SIPSorcery are not needed at run time.
            rm -f "${dir:?}"/*.pdb "${dir:?}"/*.xml "${dir:?}"/*.dll
            cp README.md LICENSE docs/policy.example.json docs/secrets.env.example docs/pbx-voice.service "$dir"/
            tar -C out -czf "pbx-voice-$version-$rid.tar.gz" "pbx-voice-$version-$rid"
          done
          sha256sum pbx-voice-*.tar.gz > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pbx-voice-*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pbx-voice-*.tar.gz SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
